server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;

  # A API usa a mesma origem da SPA. O Service backend distribui as
  # conexões entre as duas réplicas do Spring Boot.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Cabeçalho didático para comprovar qual Pod de backend respondeu.
    # Remova este cabeçalho em uma implantação de produção exposta publicamente.
    add_header X-G7-Backend $upstream_addr always;
  }

  # SPA: qualquer rota do Angular cai no index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
