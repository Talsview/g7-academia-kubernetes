apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: g7-academia
  labels:
    app.kubernetes.io/part-of: g7-academia
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: db-service
  namespace: g7-academia
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: g7-academia
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
