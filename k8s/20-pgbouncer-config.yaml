apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: g7-academia
  labels:
    app.kubernetes.io/part-of: g7-academia
data:
  pgbouncer.ini: |
    ; Configuração do PgBouncer adaptada do bd/pgbouncer.ini do G7 Academia.
    [databases]
    g7_academia = host=db-service port=5432 dbname=g7_academia

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    auth_type = scram-sha-256
    auth_file = /tmp/userlist.txt
    pool_mode = transaction
    max_client_conn = 100
    default_pool_size = 10
    min_pool_size = 2
    reserve_pool_size = 2
    max_prepared_statements = 100
    ignore_startup_parameters = extra_float_digits
    server_idle_timeout = 300
    query_wait_timeout = 30
    logfile = /dev/null
    admin_users =
