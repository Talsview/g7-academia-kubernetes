apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: g7-academia
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: g7-academia
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 240
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: g7-academia
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: g7-academia-backend:stage4-cors
          imagePullPolicy: Never
          env:
            - name: DB_URL
              value: jdbc:postgresql://pgbouncer-service:6432/g7_academia
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: g7-db-secret
                  key: APP_DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: g7-db-secret
                  key: APP_DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: g7-app-secret
                  key: JWT_SECRET
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=55.0 -XX:InitialRAMPercentage=15.0"
            - name: OTEL_SERVICE_NAME
              value: g7-academia-backend
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=g7-academia,deployment.environment=local
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_always_on
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
