apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: g7-academia
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: g7-academia
spec:
  replicas: 2
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: g7-academia
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: g7-academia-backend:stage3
          imagePullPolicy: Never
          env:
            - name: DB_URL
              value: jdbc:postgresql://pgbouncer-service:6432/g7_academia
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: g7-db-secret
                  key: APP_DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: g7-db-secret
                  key: APP_DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: g7-app-secret
                  key: JWT_SECRET
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=65.0 -XX:InitialRAMPercentage=20.0"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 512Mi
