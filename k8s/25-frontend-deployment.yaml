apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: g7-academia
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: g7-academia
spec:
  replicas: 2
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: g7-academia
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: frontend
          image: g7-academia-frontend:stage3
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
